<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Ninja Tales — Village Trial</title><style>
*{box-sizing:border-box}body{margin:0;background:#172b26;color:#f6efda;font:15px system-ui;text-align:center}header{padding:12px}h1{font-size:23px;margin:0}small{color:#c9d5c8}.wrap{max-width:960px;margin:auto;padding:0 10px}canvas{display:block;width:min(100%,800px);aspect-ratio:16/10;image-rendering:pixelated;border:5px solid #c3a46d;border-radius:8px;background:#78ad67;touch-action:none}.hud{display:flex;justify-content:space-between;gap:8px;margin:8px 0;flex-wrap:wrap}.controls{display:flex;justify-content:space-between;align-items:center;max-width:700px;margin:12px auto;padding-bottom:env(safe-area-inset-bottom)}button{background:#e6c27c;color:#292e28;border:2px solid #66553e;border-radius:9px;font-weight:800;font-size:18px;min-width:55px;min-height:52px;touch-action:none}.pad{display:grid;grid-template-columns:repeat(3,55px);gap:4px}.pad .up{grid-column:2}.pad .left{grid-column:1}.pad .down{grid-column:2}.pad .right{grid-column:3}.actions{display:flex;gap:8px}#dialog{min-height:44px;padding:9px;border:2px solid #b5a17a;background:#273c31;border-radius:8px;text-align:left}footer{padding:8px;color:#c9d5c8}</style></head>
<body><header><h1>NINJA TALES</h1><small>Village Trial v0.1 · Original placeholder world</small></header><div class="wrap"><div class="hud"><span id="location">Leafwood Village</span><span id="objective">Objective: Speak to the instructor</span></div><canvas id="game" width="640" height="400" aria-label="Playable top-down village"></canvas><div id="dialog" aria-live="polite">Use arrow keys or WASD to walk. Press E or ACTION to interact.</div><div class="controls"><div class="pad"><button class="up" data-dir="up">▲</button><button class="left" data-dir="left">◀</button><button class="down" data-dir="down">▼</button><button class="right" data-dir="right">▶</button></div><div class="actions"><button id="act">ACTION</button><button id="save">SAVE</button></div></div></div><footer>Prototype only · Desktop and mobile controls · No licensed art</footer>
<script>
(()=>{'use strict';const c=document.querySelector('#game'),g=c.getContext('2d');g.imageSmoothingEnabled=false;const W=40,H=25,T=16;let p={x:20,y:19},facing='up',talked=false,battle=false,hp=40,enemyHp=30,turn=0;const walls=new Set(),houses=[{x:5,y:4,w:7,h:5,name:'Village Hall'},{x:24,y:4,w:8,h:5,name:'Training Academy'},{x:6,y:15,w:7,h:5,name:'Home'},{x:27,y:15,w:7,h:5,name:'Supply Shop'}];const npcs=[{x:21,y:10,name:'Instructor',text:'Training starts now! You can practice your first tactical encounter.'},{x:15,y:17,name:'Villager',text:'Welcome to Leafwood Village. Explore the paths and gardens!'}];const key=(x,y)=>x+','+y;function block(x,y){return x<1||y<1||x>=W-1||y>=H-1||walls.has(key(x,y))||npcs.some(n=>n.x===x&&n.y===y)};houses.forEach(h=>{for(let y=h.y;y<h.y+h.h;y++)for(let x=h.x;x<h.x+h.w;x++)walls.add(key(x,y))});for(let x=0;x<W;x++){walls.add(key(x,0));walls.add(key(x,H-1))}for(let y=0;y<H;y++){walls.add(key(0,y));walls.add(key(W-1,y))}function rect(x,y,w,h,color){g.fillStyle=color;g.fillRect(x*T,y*T,w*T,h*T)}function message(t){document.querySelector('#dialog').textContent=t}function draw(){g.fillStyle='#8bbd72';g.fillRect(0,0,640,400);for(let y=0;y<H;y++)for(let x=0;x<W;x++){if((x*17+y*11)%13===0)rect(x+.4,y+.5,.2,.2,'#65a45e');if((x*7+y*13)%23===0)rect(x+.5,y+.3,.12,.12,'#e9db8c')}rect(17,1,6,23,'#d7bd86');rect(1,11,38,3,'#d7bd86');rect(2,21,36,2,'#d7bd86');for(let y=2;y<10;y++)for(let x=34;x<39;x++){rect(x,y,1,1,(x+y)%2?'#4a9ec4':'#65b9d6')}for(let x=2;x<38;x++){if(x>=17&&x<=23)continue;if(x%3===0){tree(x,2);tree(x,23)}}for(const h of houses){rect(h.x,h.y+1,h.w,h.h-1,'#e4d0a1');rect(h.x-.3,h.y,h.w+.6,2,'#a14e40');rect(h.x+1,h.y+2,1,1,'#557c85');rect(h.x+h.w-2,h.y+2,1,1,'#557c85');rect(h.x+Math.floor(h.w/2),h.y+h.h-2,1,2,'#694f3e');g.fillStyle='#fff6df';g.font='9px monospace';g.fillText(h.name,h.x*T,(h.y-.4)*T)}for(const n of npcs)person(n.x,n.y,'#384d8a');person(p.x,p.y,'#ef9b33');if(battle)drawBattle()}function tree(x,y){rect(x+.4,y+.6,.25,.5,'#70553b');rect(x-.2,y-.2,1.4,1,'#397a48');rect(x,y-.5,1,.8,'#4b9755')}function person(x,y,color){rect(x+.22,y+.45,.56,.5,color);rect(x+.22,y+.12,.56,.45,'#f3c796');rect(x+.1,y,.8,.2,'#333f38');rect(x+.2,y+.9,.2,.1,'#313f49');rect(x+.6,y+.9,.2,.1,'#313f49')}function move(d){if(battle)return;facing=d;let dx=d==='left'?-1:d==='right'?1:0,dy=d==='up'?-1:d==='down'?1:0;if(!block(p.x+dx,p.y+dy)){p.x+=dx;p.y+=dy}draw()}function interact(){if(battle){enemyHp=Math.max(0,enemyHp-10);turn++;if(enemyHp===0){battle=false;talked=true;document.querySelector('#objective').textContent='Objective complete: Training cleared';message('Training victory! You completed the village trial.');}else{hp=Math.max(1,hp-5);message('You strike! The training opponent counters. HP '+hp+'/40. Press ACTION again.')}draw();return}let dx=facing==='left'?-1:facing==='right'?1:0,dy=facing==='up'?-1:facing==='down'?1:0;const n=npcs.find(n=>Math.abs(n.x-p.x)+Math.abs(n.y-p.y)<=1);if(n){message(n.name+': '+n.text);if(n.name==='Instructor'&&!talked){battle=true;hp=40;enemyHp=30;turn=0;draw();message('Training battle! Press ACTION to use a basic strike (10 damage).')}}else message('There is nothing to interact with here.');}function drawBattle(){g.fillStyle='#e8dfbf';g.fillRect(55,55,530,290);g.strokeStyle='#423d35';g.lineWidth=4;g.strokeRect(55,55,530,290);g.fillStyle='#263a30';g.font='bold 20px monospace';g.fillText('TACTICAL TRAINING',90,100);g.font='17px monospace';g.fillText('Opponent HP: '+enemyHp+'/30',90,150);g.fillText('Your HP: '+hp+'/40',90,190);g.fillText('ACTION: Basic Strike',90,245);g.fillText('Turn '+(turn+1),90,280)}function save(){localStorage.setItem('ninja-tales-trial',JSON.stringify({p,talked}));message('Progress saved on this device.')}try{const v=JSON.parse(localStorage.getItem('ninja-tales-trial')||'null');if(v&&v.p&&!block(v.p.x,v.p.y)){p=v.p;talked=!!v.talked;if(talked)document.querySelector('#objective').textContent='Objective complete: Training cleared'}}catch(e){}document.addEventListener('keydown',e=>{const d={ArrowUp:'up',KeyW:'up',ArrowDown:'down',KeyS:'down',ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right'}[e.code];if(d){e.preventDefault();move(d)}else if(e.code==='KeyE'||e.code==='Space'){e.preventDefault();interact()}});document.querySelectorAll('[data-dir]').forEach(b=>b.addEventListener('pointerdown',e=>{e.preventDefault();move(b.dataset.dir)}));document.querySelector('#act').addEventListener('click',interact);document.querySelector('#save').addEventListener('click',save);draw()})();
</script></body></html>
